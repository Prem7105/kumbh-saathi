name: Feature request
description: Suggest a practical improvement for pilgrims, volunteers, or organisers.
title: '[Feature] '
body:
  - type: textarea
    id: problem
    attributes:
      label: Who needs this and what problem does it solve?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: Describe the workflow and how you would verify it.
    validations:
      required: true
  - type: textarea
    id: considerations
    attributes:
      label: Offline, accessibility, and privacy considerations
