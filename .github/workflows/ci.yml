name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Webhook, database and mobile regression tests
            directory: kumbhsaathi-whatsapp
            command: npm test
          - name: Command center production build
            directory: kumbhsaathi-command-center
            command: npm run build
          - name: Android bundle
            directory: kumbhsaathi-mobile
            command: npx --no-install expo export --platform android --output-dir dist-check
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      EXPO_NO_TELEMETRY: '1'
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: ${{ matrix.command }}

  booth:
    name: Booth security tests
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: kumbhsaathi-ipad
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: kumbhsaathi-ipad/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest test_security -v
