version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directories:
      - /kumbhsaathi-command-center
      - /kumbhsaathi-mobile
      - /kumbhsaathi-whatsapp
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /kumbhsaathi-ipad
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
